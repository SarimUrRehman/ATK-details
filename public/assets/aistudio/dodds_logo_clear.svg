<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" width="100%" height="100%" fill="none">
  <!-- Dark background container with subtle rounded corners if standalone -->
  <rect width="440" height="160" fill="transparent" />

  <!-- 1. Sleek Supercar Silhouette (Pure White with Red Taillight and Aero Contours) -->
  <g transform="translate(10, 8)">
    <!-- Red Rear Taillight / Diffuser Glow -->
    <path d="M 64 52 L 54 55 L 56 61 L 68 55 Z" fill="#E10600" />
    <circle cx="56" cy="57" r="3" fill="#E10600" opacity="0.9" />

    <!-- Aerodynamic Fastback Roofline & Windshield -->
    <path 
      d="M 60 52 
         C 88 47, 132 40, 185 36 
         C 230 33, 268 40, 290 55 
         C 285 55, 275 50, 240 45 
         C 195 40, 150 46, 75 55 
         Z" 
      fill="#FFFFFF" 
    />

    <!-- Rear Quarter, Window Sill & Side Intake Sweep -->
    <path 
      d="M 125 56 
         C 155 58, 205 60, 255 64 
         L 260 68 
         C 205 63, 155 61, 138 78 
         L 132 75 
         C 142 63, 148 59, 125 56 Z" 
      fill="#FFFFFF" 
      opacity="0.95"
    />

    <!-- Side Window Glass Contour -->
    <path 
      d="M 170 42 
         C 205 38, 235 44, 252 54 
         L 185 51 
         Z" 
      fill="#FFFFFF" 
      opacity="0.8"
    />

    <!-- Front Hood & Nose Contour (Low-Slung Supercar Wedge) -->
    <path 
      d="M 285 54 
         C 310 59, 342 68, 368 76 
         L 366 79 
         C 335 71, 305 63, 278 57 
         Z" 
      fill="#FFFFFF" 
    />

    <!-- Front Aero Nose Tip Accent (Red Accent Tick) -->
    <path d="M 368 76 L 372 78 L 366 80 L 362 78 Z" fill="#E10600" />

    <!-- Rear Wheel Arch Archline -->
    <path 
      d="M 72 73 
         C 80 60, 110 59, 122 74 
         C 114 65, 88 65, 72 73 Z" 
      fill="#FFFFFF" 
      opacity="0.9"
    />

    <!-- Front Wheel Arch Archline -->
    <path 
      d="M 276 74 
         C 285 62, 318 63, 332 78 
         C 322 68, 292 68, 276 74 Z" 
      fill="#FFFFFF" 
      opacity="0.9"
    />

    <!-- Rear Lower Ground Effects Lip -->
    <path d="M 52 64 L 68 64 L 66 67 L 50 67 Z" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- 2. "D O D D S" - Bold, Modern Geometric Typeface in Crisp White -->
  <g transform="translate(220, 112)" text-anchor="middle">
    <!-- D -->
    <text 
      x="-92" 
      y="0" 
      fill="#FFFFFF" 
      font-family="'Oswald', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="700" 
      font-size="34" 
      letter-spacing="1"
    >D</text>

    <!-- O -->
    <text 
      x="-46" 
      y="0" 
      fill="#FFFFFF" 
      font-family="'Oswald', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="700" 
      font-size="34" 
      letter-spacing="1"
    >O</text>

    <!-- D -->
    <text 
      x="0" 
      y="0" 
      fill="#FFFFFF" 
      font-family="'Oswald', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="700" 
      font-size="34" 
      letter-spacing="1"
    >D</text>

    <!-- D -->
    <text 
      x="46" 
      y="0" 
      fill="#FFFFFF" 
      font-family="'Oswald', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="700" 
      font-size="34" 
      letter-spacing="1"
    >D</text>

    <!-- S -->
    <text 
      x="92" 
      y="0" 
      fill="#FFFFFF" 
      font-family="'Oswald', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="700" 
      font-size="34" 
      letter-spacing="1"
    >S</text>
  </g>

  <!-- 3. "— MOBILE DETAILING —" in Crimson Red with Flanking Rules -->
  <g transform="translate(220, 138)">
    <!-- Left Flanking Rule -->
    <line x1="-155" y1="-4" x2="-80" y2="-4" stroke="#E10600" stroke-width="1.8" stroke-linecap="round" />

    <!-- Subtitle Text -->
    <text 
      x="0" 
      y="0" 
      fill="#E10600" 
      font-family="'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif" 
      font-weight="700" 
      font-size="14.5" 
      letter-spacing="4.5" 
      text-anchor="middle"
    >MOBILE DETAILING</text>

    <!-- Right Flanking Rule -->
    <line x1="80" y1="-4" x2="155" y2="-4" stroke="#E10600" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
